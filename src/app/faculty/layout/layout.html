<div class="faculty-theme" [class.dark-mode]="isDarkMode">
  <div class="app-shell">

    <!-- DESKTOP SIDEBAR (Fixed Left) -->
    <aside class="sidebar desktop-only">
      <div class="sidebar-logo">
        <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M2 17L12 22L22 17" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M2 12L12 17L22 12" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="logo-text">PracticalHub</span>
      </div>

      <div class="sidebar-user">
        <div class="avatar">VP</div>
        <div class="info">
          <p class="name">Prof. Vivek</p>
          <p class="dept">Faculty · CS Dept</p>
        </div>
      </div>

      <nav class="nav-links">
        <div class="nav-label">MAIN</div>

        <!-- Dashboard -->
        <a class="nav-item" routerLink="dashboard" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Dashboard
        </a>

        <!-- Classrooms -->
        <a class="nav-item" routerLink="classrooms" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Classrooms <span class="badge">3</span>
        </a>

        <!-- Practicals -->
        <a class="nav-item" routerLink="practicals" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          Practicals
        </a>

        <!-- Students -->
        <a class="nav-item" routerLink="students" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Students
        </a>

        <!-- Results -->
        <a class="nav-item" routerLink="results" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          Results
        </a>

        <!-- Profile -->
        <a class="nav-item" routerLink="profile" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Profile
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="logout" routerLink="/">
          <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Sign out
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-body">
      <header class="topbar">
        <div class="mobile-logo mobile-only">
          <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="#3C3489" stroke-width="2">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M2 17L12 22L22 17" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M2 12L12 17L22 12" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>PracticalHub</span>
        </div>
        <h2 class="page-title desktop-only">Faculty Portal</h2>

        <div class="top-actions">
          <!-- Theme Toggle -->
          <button class="icon-btn theme-toggle" (click)="setTheme(isDarkMode ? 'light' : 'dark')">
            <svg *ngIf="isDarkMode" class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg *ngIf="!isDarkMode" class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>

          <!-- Notifications -->
          <button class="icon-btn notif-btn">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>

          <!-- New Practical Button -->
          <button class="btn-primary desktop-only" routerLink="assign-practical">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New Practical
          </button>
        </div>
      </header>

      <!-- INDEPENDENT SCROLLVIEW CONTENT -->
      <div class="page-content">
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- MOBILE BOTTOM NAV -->
    <nav class="mobile-bottom-nav mobile-only">
      <a class="m-nav-item" routerLink="dashboard" routerLinkActive="active">
        <svg class="m-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span class="m-text">Home</span>
      </a>

      <a class="m-nav-item" routerLink="classrooms" routerLinkActive="active">
        <svg class="m-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="m-text">Classes</span>
      </a>

      <a class="m-nav-item" routerLink="practicals" routerLinkActive="active">
        <svg class="m-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span class="m-text">Labs</span>
      </a>

      <button class="m-nav-item more-btn" (click)="toggleMobileMenu()">
        <svg class="m-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="19" cy="12" r="1"></circle>
          <circle cx="5" cy="12" r="1"></circle>
        </svg>
        <span class="m-text">More</span>
      </button>
    </nav>

    <!-- MOBILE OVERLAY MENU -->
    <div class="mobile-more-menu" [class.open]="isMobileMenuOpen">
      <div class="menu-overlay" (click)="toggleMobileMenu()"></div>
      <div class="menu-sheet">
        <div class="sheet-header">
          <h3>More Options</h3>
          <button class="close-btn" (click)="toggleMobileMenu()">✕</button>
        </div>
        <div class="sheet-links">
          <a class="sheet-item" routerLink="assign-practical" (click)="toggleMobileMenu()">
            <svg class="sheet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            Assign Practical
          </a>

          <a class="sheet-item" routerLink="students" (click)="toggleMobileMenu()">
            <svg class="sheet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
            </svg>
            Students
          </a>

          <a class="sheet-item" routerLink="results" (click)="toggleMobileMenu()">
            <svg class="sheet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            Results
          </a>

          <a class="sheet-item" routerLink="profile" (click)="toggleMobileMenu()">
            <svg class="sheet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            My Profile
          </a>

          <div class="divider"></div>

          <a class="sheet-item text-danger" routerLink="/" (click)="toggleMobileMenu()">
            <svg class="sheet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Sign out
          </a>
        </div>
      </div>
    </div>

  </div>
</div>
