<div class="faculty-theme">
  <div class="app-shell">

    <aside class="sidebar desktop-only">
      <div class="sidebar-logo">
        <span class="icon">💠</span>
        <span class="logo-text">PracticalHub</span>
      </div>

      <div class="sidebar-user">
        <div class="avatar">VP</div>
        <div class="info">
          <p class="name">Prof. Vivek</p>
          <p class="dept">Faculty · CS Dept</p>
        </div>
      </div>

      <nav class="nav-links">
        <div class="nav-label">MAIN</div>
        <a class="nav-item" routerLink="dashboard" routerLinkActive="active">📊 Dashboard</a>
        <a class="nav-item" routerLink="classrooms" routerLinkActive="active">🏫 Classrooms <span class="badge">3</span></a>
        <a class="nav-item" routerLink="practicals" routerLinkActive="active">📄 Practicals</a>
        <a class="nav-item" routerLink="assign-practical" routerLinkActive="active">⊕ Assign</a>
        <a class="nav-item" routerLink="students" routerLinkActive="active">👥 Students</a>
        <a class="nav-item" routerLink="results" routerLinkActive="active">📉 Results</a>
      </nav>

      <div class="sidebar-footer">
        <div class="logout" routerLink="/">🚪 Sign out</div>
      </div>
    </aside>

    <main class="main-body">

      <header class="topbar">
        <div class="mobile-logo mobile-only">
          <span class="icon">💠</span> PracticalHub
        </div>
        <h2 class="page-title desktop-only">Faculty Portal</h2>

        <div class="top-actions">
          <button class="icon-btn theme-toggle" (click)="setTheme(isDarkMode ? 'light' : 'dark')">
            {{ isDarkMode ? '🌙' : '☀️' }}
          </button>
          <button class="icon-btn notif-btn">🔔</button>
          <button class="btn-primary desktop-only" routerLink="assign-practical">+ New</button>
        </div>
      </header>

      <div class="page-content">
        <router-outlet></router-outlet>
      </div>
    </main>

    <nav class="mobile-bottom-nav mobile-only">
      <a class="m-nav-item" routerLink="dashboard" routerLinkActive="active">
        <span class="m-icon">📊</span>
        <span class="m-text">Home</span>
      </a>
      <a class="m-nav-item" routerLink="classrooms" routerLinkActive="active">
        <span class="m-icon">🏫</span>
        <span class="m-text">Classes</span>
      </a>
      <a class="m-nav-item" routerLink="practicals" routerLinkActive="active">
        <span class="m-icon">📄</span>
        <span class="m-text">Practicals</span>
      </a>
      <a class="m-nav-item" routerLink="profile" routerLinkActive="active">
        <span class="m-icon">👤</span>
        <span class="m-text">Profile</span>
      </a>
      <button class="m-nav-item more-btn" (click)="toggleMobileMenu()">
        <span class="m-icon">⋮</span>
        <span class="m-text">More</span>
      </button>
    </nav>

    <div class="mobile-more-menu" [class.open]="isMobileMenuOpen">
      <div class="menu-overlay" (click)="toggleMobileMenu()"></div>
      <div class="menu-sheet">
        <div class="sheet-header">
          <h3>More Options</h3>
          <button class="close-btn" (click)="toggleMobileMenu()">✕</button>
        </div>
        <div class="sheet-links">
          <a class="sheet-item" routerLink="assign-practical">⊕ Assign Practical</a>
          <a class="sheet-item" routerLink="students">👥 Students</a>
          <a class="sheet-item" routerLink="results">📉 Results</a>
          <div class="divider"></div>
          <a class="sheet-item text-danger" routerLink="/">🚪 Sign out</a>
        </div>
      </div>
    </div>

  </div>
</div>
