<div class="practicals-container">
  <header class="page-header">
    <h1 class="page-title">My Practicals</h1>
  </header>

  <div class="filters-scroll-wrapper">
    <div class="filters">
      <button class="filter-chip"
              *ngFor="let filter of filters"
              [class.active]="activeFilter === filter"
              (click)="setActiveFilter(filter)">
        {{ filter }}
      </button>
    </div>
  </div>

  <div class="subject-group" *ngFor="let group of filteredSubjectGroups">
    <div class="subject-header">
      <div class="subject-title">
        <span class="dot" [ngClass]="group.dotClass"></span>
        <h2>{{ group.title }}</h2>
      </div>
      <div class="subject-stats">{{ group.filteredPracticalsCount }} practicals &nbsp;&middot;&nbsp; Avg {{ group.averageScore }}</div>
    </div>

    <div class="practical-list" *ngIf="group.filteredPracticals.length > 0">
      <div class="practical-row"
           *ngFor="let prac of group.filteredPracticals"
           (click)="goToSolve(prac.id)">

        <div class="row-num">{{ prac.num }}</div>

        <div class="icon-wrapper" [ngClass]="prac.iconClass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [innerHTML]="prac.iconSvg"></svg>
        </div>

        <div class="row-content">
          <h4>{{ prac.title }}</h4>
          <div class="mobile-meta">{{ prac.language }} &nbsp;&middot;&nbsp; {{ prac.points }}</div>
        </div>

        <div class="row-meta desktop-only">{{ prac.language }}</div>
        <div class="row-meta desktop-only">{{ prac.points }}</div>

        <div class="row-status">
          <span class="badge" [ngClass]="prac.statusClass">{{ prac.status }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
