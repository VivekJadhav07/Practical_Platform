<div class="solve-page">

  <header class="solve-header">
    <h2>Solve — {{ problem.title }}</h2>
  </header>

  <div class="solve-layout">

    <!-- LEFT : PROBLEM -->
    <div class="left-pane">

      <div class="card problem-card">

        <div class="card-top-meta">
          <span class="section-label">PROBLEM</span>

          <div class="pills">
            <span class="pill pill-lang">
              {{ problem.language }}
            </span>

            <span class="pill pill-marks">
              {{ problem.marks }} marks
            </span>

            <span class="pill pill-due">
              {{ problem.dueDate }}
            </span>
          </div>
        </div>

        <h3 class="problem-title">
          {{ problem.title }}
        </h3>

        <div
          class="problem-desc"
          [innerHTML]="problem.description">
        </div>

        <p class="problem-constraints">
          {{ problem.constraints }}
        </p>

        <div class="tags">
          <span
            class="tag"
            *ngFor="let tag of problem.tags">
            {{ tag }}
          </span>
        </div>

      </div>

    </div>


    <!-- RIGHT : COMPILER -->
    <div class="right-pane">

      <div class="editor-container">

        <!-- TOOLBAR -->
        <div class="editor-toolbar">

          <div class="lang-selector">
            <select
              [(ngModel)]="selectedLanguage"
              (change)="changeLanguage()">

              <option
                *ngFor="let lang of availableLanguages"
                [value]="lang">

                {{ lang }}

              </option>

            </select>
          </div>


          <button
            class="btn-run"
            (click)="runCode()"
            [disabled]="isRunning">

            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="currentColor">

              <path d="M8 5v14l11-7z"/>

            </svg>

            {{ isRunning ? 'Running...' : 'Run' }}

          </button>

        </div>


        <!-- CODE EDITOR -->
        <div class="editor-body">

          <textarea
            class="code-textarea"
            [(ngModel)]="codeContent"
            spellcheck="false">
          </textarea>

        </div>

      </div>


      <!-- INPUT -->
      <div class="card io-card">

        <div class="io-header">
          <span class="section-label">INPUT</span>
          <span class="io-hint">
            Enter custom input
          </span>
        </div>

        <textarea
          class="input-textarea"
          [(ngModel)]="inputContent"
          placeholder="Enter input here...">
        </textarea>

      </div>


      <!-- OUTPUT -->
      <div class="card io-card">

        <div class="io-header">
          <span class="section-label">OUTPUT</span>

          <span
            class="execution-status"
            *ngIf="statusMessage">

            {{ statusMessage }}

          </span>
        </div>

        <pre class="output-content">{{ outputContent }}</pre>

      </div>


      <!-- SUBMIT -->
      <button
        class="btn-submit"
        (click)="submitSolution()">

        Submit solution →

      </button>

    </div>

  </div>

</div>
